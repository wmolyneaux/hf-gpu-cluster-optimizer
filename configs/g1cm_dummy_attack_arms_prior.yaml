# game1CreatureMesh dummy attack: generation 0 on the ARMS-CLEARED reference (retarget.clear_arms: forearms and fists out of the face)
# (strike_reach: striking side + head clearance). Profile camera. Four 43-frame windows, one L4 each (blender_script lane).
# COST (budget-run, before launch): the pilot measured 2.0 s/frame + ~20 s setup on an L4 = ~106 s per window;
# 4 x 106 s at $0.7992/h = ~$0.09 GPU line, ~$0.12 settled. WORST CASE 4 x 600 s = $0.53.

run_id: g1cm_dummy_attack_arms_prior

runs:
- name: arms_prior_001_043
  type: blender_script
  modal:
    gpu: L4
    max_runtime_sec: 600
    est_sec_per_epoch: 150
  config:
    bundle: game1creaturemesh/dummy_attack_arms_prior.tar
    script: creature3d/render/blender_anim.py
    args:
    - --run
    - runs/dummy_attack/render/arms_prior_relax
    - --out
    - out
    - --name
    - arms_prior
    - --textured_glb
    - runs/revenant/assets/REVENANT_CHIBI_body.glb
    - --engine
    - cycles
    - --samples
    - '32'
    - --png
    - --res
    - '1280'
    - --ground
    - '14'
    - --checker_m
    - '0.5'
    - --view
    - right
    - --no-lines
    - --smooth
    - --zoom
    - '0.8'
    - --frame_motion
    frames:
    - 1
    - 43
    out_rel: out
    expect_glob: arms_prior_*.png
