# CAMERA A, MOVED +120 deg ALONG THE ARC. Static (az +5, r28, lens16) so Oski is NOT
# tracked. Authored 2026-08-26 from camera_overlap.py + a BBoxCache landmark solve whose
# selftest reproduces all five on-disk camera measurements.
#
# READ THIS BEFORE LAUNCHING. A FREE local Metal preview of THIS EXACT CAMERA measured
# only 7 objects shared with the az -62 wide, 6 of them foliage/ground, and NO Campanile:
# the oak canopy occludes the architecture from both positions. The geometric tool
# predicted 41 shared including the tower, and it was wrong by ~6x because it ignores
# occlusion. If the goal is SHARED ARCHITECTURE, height or distance is the lever, not
# azimuth -- and this take will likely show trees. Launch anyway only with that stated.
#
# ECONOMICS: $0.62-0.65 healthy, $0.87 with placement variance, 4x A10G. Credits are
# EXHAUSTED; this bills the card.
# LANDMINE: stage via scripts/stage_oski_take.sh with the FULL shot list -- the tar must
# carry walk8s_campA120.json AND the current tools/heroshot.
run_id: oski_walk8s_campA120_r1

_gaitq: &gaitq
  retarget: shots/walk8s_campA120.json
  frames: 201
  res: 1536x768
  samples: 96
  look: magical
  npr: cel
  npr_mix: 0.65
  outline: "off"
  char_key: 0.20
  camera: bcHeroGladeCam
  guide_passes: true
  glb: rig/oski/rigged.glb
  style_card: characters/oski/style.json
  allow_fused: "gait camera: RENDERED take, fused asset stated"

runs:
  - name: q00
    type: heroshot_take
    modal: {gpu: A10G, max_runtime_sec: 1000, est_sec_per_epoch: 400}
    config: {<<: *gaitq, frame_start: 0,  frame_end: 51}
  - name: q01
    type: heroshot_take
    modal: {gpu: A10G, max_runtime_sec: 1000, est_sec_per_epoch: 400}
    config: {<<: *gaitq, frame_start: 51, frame_end: 101}
  - name: q02
    type: heroshot_take
    modal: {gpu: A10G, max_runtime_sec: 1000, est_sec_per_epoch: 400}
    config: {<<: *gaitq, frame_start: 101, frame_end: 151}
  - name: q03
    type: heroshot_take
    modal: {gpu: A10G, max_runtime_sec: 1000, est_sec_per_epoch: 400}
    config: {<<: *gaitq, frame_start: 151, frame_end: 201}
